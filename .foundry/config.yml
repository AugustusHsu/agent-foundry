# agent-foundry 自身的 Foundry 專案設定
# schema 權威：skills/foundry-platform/config-schema.md｜範例：skills/foundry-platform/config.example.yml
# 建立依據：MYL-35（抹除「本 repo 流程」與「導入其他平台的流程」之間的差異）
# 建立於 2026-09-03。agent 不得未經 foundry-gates／foundry-adopt 或使用者指示直接改本檔。

foundry: 2

# 本 repo 的執行層平台是 Paperclip（工單／狀態／看板）；
# 規則層 .md 與程式碼仍在本 git repo，兩者分工見 foundry-protocol「平台中立原則」。
devtools_platform: paperclip

# agent 在哪個 AI 平台上執行與被喚醒（MYL-82 正名，依 MYL-61 卡 00ded0b2 Q1）。
# 與上面的工具面正交——本 repo 兩者恰好都是 paperclip，那是巧合不是同義。
# 目前沒有任何動詞依本欄分派；三家的能力對照屬 MYL-78。
ai_platform: paperclip

# 可見面鏡像到 GitHub（MYL-39 計畫 v5 §3「T-2 雙軌鏡像」，使用者於確認卡 7598a79e 整包核可；
# 第一次真的建出公開 issue 另經 G-C 卡 aa3121a9 核可）。真相與喚醒面仍是上面的 devtools_platform：
# 指派 Paperclip 工單會叫醒 agent，GitHub issue 不會。鏡像是單向、唯讀的。
# 本欄依 schema「不得早於鏡像實際可用就先寫」，在 MYL-58 走完建單／改狀態／結案三個時機
# 的實測之後才寫入。怎麼鏡像見 skills/foundry-platform/adapters/github.md §「鏡像模式」。
mirror_platform: github

platform_options:
  paperclip:
    company_id: "${PAPERCLIP_COMPANY_ID}"            # My Lab；label 為公司層資源
    project_id: "e7865c0c-6a46-429c-9bd6-566bc849bfeb"  # Foundry 專案
  github:
    project_title: "Foundry"                         # user project #1（public）
    project_owner: "@me"                             # 個人專案，擁有者即 gh 登入帳號
    # 鏡像起算點：MYL-58 是第一張真的鏡像出去的單，之前的 57 張沒有回填。
    # 回填是批次對外動作、要另外核可（不在 MYL-54 範圍），所以這裡不是「少看幾條紅燈」，
    # 而是誠實標出鏡像涵蓋的邊界。⚠️ 調低它等於宣告舊單已回填——回填做完才改。
    mirror_since: "MYL-58"

# 關卡設定＝MYL-28 使用者於確認卡 0679629d 選定的 b-skip-small 方案
# （選定紀錄原本只存在工單留言 d8d356f1；MYL-35 起落回規則層本檔）。
gates:
  spec_approval: user       # 關卡 A（做什麼）
  design_approval:          # 關卡 B（怎麼做）
    approver: user
    skip_below: small       # 掛 size:small 的工單跳過本關
  external_actions: user    # 關卡 C（要不要出去）：固定 user，不可調降

push:
  branch_push: tech-lead    # MYL-27 核可下放：工單分支 push＋開 PR 由 Tech Lead 自動
  main_push: user           # 硬約束：push main／force-push／tag 一律使用者專屬，schema 不允許其他值
  # 本欄與本 repo 現況的已知落差（MYL-35 G7，使用者 2026-09-03 於確認卡 cc915d68 裁定「選項 A：
  # 維持硬約束不放寬」）：MYL-23 核可的 P1 常設授權含「合併回 main 後 push origin，執行者自行」，
  # 本欄無法表達，故本 repo 的 push 授權以 protocol 第 7、9 節分級表為準，本欄只承載該表的 P3 部分。
  #   ⚠️ 這條例外是使用者對「本 repo」的個別裁定，**不隨 foundry-init／foundry-adopt 傳染**：
  #      導入 Foundry 的其他專案一律照本欄字面執行——main push 無例外，不得援引本 repo 前例放行。

# 模型供應商路由（MYL-128 首次寫入，依 MYL-125 計畫修訂 2；規則本體＝protocol 第 8 節 M4~M6，
# 欄位權威＝skills/foundry-platform/config-schema.md「model_routing」一節）。
# ⚠️ 本段一存在就代表「路由已啟用」，M4 的第二個前提因此成立（見計畫第 6 節註 3）。
#
# 形狀是「命名 profile ＋ active 指標」：登記多套配置、任何時刻只有一套生效。
# 只有 active 這一欄 agent 動得了（M6 第 1 級常設授權，義務是留執行單與逐角色回查證據）；
# profile 的增修刪與內容一律使用者專屬（M6 第 2 級），agent 不得自行改。
#
# ⚠️ 本段宣告的是**應然**，與平台實況的對帳不歸 --selfcheck（同 org.yml 那條界線）：
#    selfcheck 只驗 repo 內宣告的自洽性，平台對帳要 API 金鑰、進不了 pre-commit。
#    第一次真的跑往返切換與對帳是 MYL-125 計畫的 C5，不是本段寫入的當下。
model_routing:
  # 2026-09-07 14:41 使用者於 MYL-125 留言指示：codex 額度耗盡，全隊先回 claude，
  # 並要求 CEO 破例直接改（含 M6 第 2 級的 profile 增修）。授權原文在該單留言
  # 27125d26-904f-4965-9374-11de4a489346；本段三處改動（新增 claude-only、active 換手、
  # normal-mixed 換角色）全部依那一則。
  active: claude-only
  profiles:
    # 用在「codex 額度耗盡、只剩 claude 一家可用」的期間：不做任何 roles 覆寫，
    # 全隊一律 default_provider。⚠️ 這代表 Developer 與 Code Reviewer 同廠，
    # 所以本 profile 必須掛 waiver（emergency + waives_m4 + waiver_reason 三件缺一非法）。
    claude-only:
      default_provider: claude
      review_provider_distinct: true
      emergency: true
      waives_m4: true
      waiver_reason: >-
        Codex 額度耗盡期間，使用者指定全隊回到單一供應商 claude（MYL-125 留言
        27125d26，2026-09-07 14:41）。只剩一家可用時 M4 的第一個前提本來就不成立，
        但 probe_providers 只驗 CLI 在不在、驗不到額度——它仍會回報「2 家可用」，
        於是機械上 M4 看似成立。掛明文 waiver 是為了讓這個落差留下痕跡，
        而不是靠讀設定的人自己想起來。改回條件：Codex 額度恢復、且該供應商實跑
        一輪不再撞額度牆之後，依 M6 第 1 級切回 normal-mixed（Code Reviewer 與
        QA Engineer 回 codex，M4 自然成立），本 waiver 隨 active 換手即失效。
    # 名字的意思是「把角色收容到 Codex 的應急配置」，不是「全隊都在 Codex」——
    # 收容範圍就是下面 roles 列到的那兩個角色，其餘仍在 default_provider。
    codex-emergency:
      default_provider: claude
      roles:
        developer: codex        # 2026-09-07 平台實況（MYL-125 計畫第 2 節實查表）
        code-reviewer: codex    # 同上；與上一列同一家 ⇒ 靠下面的 waiver 收容
      review_provider_distinct: true
      emergency: true
      waives_m4: true
      # 改回的條件寫死在這裡，不寫在工單留言——留言會被淹掉，而這一行每次讀設定都看得到。
      waiver_reason: >-
        Claude 額度耗盡期間，使用者指定把 Developer 與 Code Reviewer 同置於 codex
        （MYL-125 計畫修訂 2 的 D2 採用 (b)：以明文 waiver 收容現況，而不是用一條剛寫好的
        規則去推翻三小時前的決定）。改回條件：Claude 額度恢復、且 probe_providers 判
        claude 為「✅ 可用」之後，依 M6 第 1 級切回 normal-mixed（Developer 回 claude、
        審查側留在 codex，M4 自然成立），本 waiver 隨 active 換手即失效。
    # 常態配置：實作 claude、審查 codex，異廠 ⇒ M4 成立，不需要也不得掛 waiver。
    # ⚠️ 2026-09-07 依使用者留言 27125d26 換過角色：Developer 由 codex 改 claude、
    #    QA Engineer 改 codex。code-reviewer 那一列使用者沒有點名，但它是**被推導出來的**：
    #    Developer 一旦落在 claude，Code Reviewer 只要也留在 claude 就同廠，而常態
    #    profile 不是 emergency、掛不上 waives_m4 ⇒ 整檔非法。codex 是唯一能同時滿足
    #    「Developer 用 claude」與 M4 的值。要改成別的，得先處理 M4。
    normal-mixed:
      default_provider: claude
      roles:
        developer: claude       # 使用者指定（原 codex）
        code-reviewer: codex    # 推導值，理由見上方 ⚠️
        qa-engineer: codex      # 使用者指定（原本沒列 ⇒ 跟隨 default_provider claude）
      review_provider_distinct: true

# 三層文檔投影（MYL-39 計畫 v5 §2「D-3」，使用者於確認卡 7598a79e 整包核可；本段值即該節寫定的值）。
# 只有 source 這一層可以人手改；wiki 與精裝站都是機械投影，手改會被下次同步覆蓋。
# 本段由 MYL-51 依上述核可寫入——依據是使用者核可的計畫，且只動 docs 段、未碰 gates／push
# （那兩段才是使用者裁定的授權邊界）。
docs:
  source: docs/handbook/     # 唯一可寫的真相，留在版控內
  primary: wiki              # 主閱讀面：wiki | repo | none
  # 手冊裡指向 skills/、templates/、docs/pilot/ 的相對連結在 wiki（另一個 repo、頁面是平的）
  # 一定失效。使用者於 MYL-52 互動卡 c79150e4（Q2）選 absolute：改寫成指回 repo 的絕對 URL。
  # ⚠️ 這個選擇有一項知情前提：repo 日後轉回 private 時，這些連結對外會變 404。
  #    wiki 的定位是內部主閱讀面，該情境下斷鏈可接受——要改就改這一欄，不要在腳本裡加特例。
  link_policy: absolute      # absolute（改寫成絕對 URL）| plain（拆為純文字）
  mirror_site:
    # AC2（「關掉就真的不發佈」）的端到端證據是 tag `handbook-v0-off-test`，
    # 它指向 commit f6b9a5a——那一顆把本欄暫時改成 false，CI 的 gate job 因此
    # 判 publish=false、deploy job 整個沒跑。要關閉精裝站就是改這一欄，
    # 不必動 workflow 裡 `on: push: tags:` 的 glob（那是粗篩，權威在這裡）。
    enabled: true            # 精裝站（mkdocs）：本專案開
    trigger: tag             # tag | merge | manual
    # 四碼版本號（protocol `V4`，MYL-68）。這個 glob 是 `V4` 唯一擋得住的那一格：
    # 位數不足的 `handbook-v1`／`v1.1`／`v1.1.1` 一律判 publish=false。它只數點、
    # 不看內容——多一位或非數字仍會通過，遞增規則更是驗不到，別把它讀成全套後盾。
    tag_pattern: 'handbook-v*.*.*.*'
