# agent-foundry 自身的 Foundry 專案設定
# schema 權威：skills/foundry-platform/config-schema.md｜範例：skills/foundry-platform/config.example.yml
# 建立依據：MYL-35（抹除「本 repo 流程」與「導入其他平台的流程」之間的差異）
# 建立於 2026-09-03。agent 不得未經 foundry-gates／foundry-adopt 或使用者指示直接改本檔。

foundry: 1

# 本 repo 的執行層平台是 Paperclip（工單／狀態／看板）；
# 規則層 .md 與程式碼仍在本 git repo，兩者分工見 foundry-protocol「平台中立原則」。
platform: paperclip

# 可見面鏡像到 GitHub（MYL-39 計畫 v5 §3「T-2 雙軌鏡像」，使用者於確認卡 7598a79e 整包核可；
# 第一次真的建出公開 issue 另經 G-C 卡 aa3121a9 核可）。真相與喚醒面仍是上面的 platform：
# 指派 Paperclip 工單會叫醒 agent，GitHub issue 不會。鏡像是單向、唯讀的。
# 本欄依 schema「不得早於鏡像實際可用就先寫」，在 MYL-58 走完建單／改狀態／結案三個時機
# 的實測之後才寫入。怎麼鏡像見 skills/foundry-platform/adapters/github.md §「鏡像模式」。
mirror_platform: github

platform_options:
  paperclip:
    company_id: "${PAPERCLIP_COMPANY_ID}"            # My Lab；label 為公司層資源
    project_id: "e7865c0c-6a46-429c-9bd6-566bc849bfeb"  # Foundry 專案
  github:
    project_title: "Foundry"                         # user project #1（public）
    project_owner: "@me"                             # 個人專案，擁有者即 gh 登入帳號
    # 鏡像起算點：MYL-58 是第一張真的鏡像出去的單，之前的 57 張沒有回填。
    # 回填是批次對外動作、要另外核可（不在 MYL-54 範圍），所以這裡不是「少看幾條紅燈」，
    # 而是誠實標出鏡像涵蓋的邊界。⚠️ 調低它等於宣告舊單已回填——回填做完才改。
    mirror_since: "MYL-58"

# 關卡設定＝MYL-28 使用者於確認卡 0679629d 選定的 b-skip-small 方案
# （選定紀錄原本只存在工單留言 d8d356f1；MYL-35 起落回規則層本檔）。
gates:
  spec_approval: user       # 關卡 A（做什麼）
  design_approval:          # 關卡 B（怎麼做）
    approver: user
    skip_below: small       # 掛 size:small 的工單跳過本關
  external_actions: user    # 關卡 C（要不要出去）：固定 user，不可調降

push:
  branch_push: tech-lead    # MYL-27 核可下放：工單分支 push＋開 PR 由 Tech Lead 自動
  main_push: user           # 硬約束：push main／force-push／tag 一律使用者專屬，schema 不允許其他值
  # 本欄與本 repo 現況的已知落差（MYL-35 G7，使用者 2026-09-03 於確認卡 cc915d68 裁定「選項 A：
  # 維持硬約束不放寬」）：MYL-23 核可的 P1 常設授權含「合併回 main 後 push origin，執行者自行」，
  # 本欄無法表達，故本 repo 的 push 授權以 protocol 第 7、9 節分級表為準，本欄只承載該表的 P3 部分。
  #   ⚠️ 這條例外是使用者對「本 repo」的個別裁定，**不隨 foundry-init／foundry-adopt 傳染**：
  #      導入 Foundry 的其他專案一律照本欄字面執行——main push 無例外，不得援引本 repo 前例放行。

# 三層文檔投影（MYL-39 計畫 v5 §2「D-3」，使用者於確認卡 7598a79e 整包核可；本段值即該節寫定的值）。
# 只有 source 這一層可以人手改；wiki 與精裝站都是機械投影，手改會被下次同步覆蓋。
# 本段由 MYL-51 依上述核可寫入——依據是使用者核可的計畫，且只動 docs 段、未碰 gates／push
# （那兩段才是使用者裁定的授權邊界）。
docs:
  source: docs/handbook/     # 唯一可寫的真相，留在版控內
  primary: wiki              # 主閱讀面：wiki | repo | none
  # 手冊裡指向 skills/、templates/、docs/pilot/ 的相對連結在 wiki（另一個 repo、頁面是平的）
  # 一定失效。使用者於 MYL-52 互動卡 c79150e4（Q2）選 absolute：改寫成指回 repo 的絕對 URL。
  # ⚠️ 這個選擇有一項知情前提：repo 日後轉回 private 時，這些連結對外會變 404。
  #    wiki 的定位是內部主閱讀面，該情境下斷鏈可接受——要改就改這一欄，不要在腳本裡加特例。
  link_policy: absolute      # absolute（改寫成絕對 URL）| plain（拆為純文字）
  mirror_site:
    # AC2（「關掉就真的不發佈」）的端到端證據是 tag `handbook-v0-off-test`，
    # 它指向 commit f6b9a5a——那一顆把本欄暫時改成 false，CI 的 gate job 因此
    # 判 publish=false、deploy job 整個沒跑。要關閉精裝站就是改這一欄，
    # 不必動 workflow 裡 `on: push: tags:` 的 glob（那是粗篩，權威在這裡）。
    enabled: true            # 精裝站（mkdocs）：本專案開
    trigger: tag             # tag | merge | manual
    tag_pattern: 'handbook-v*'
