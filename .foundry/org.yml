# agent-foundry 自身的組織宣告（Foundry 組織層可攜性級 2，MYL-76）
# schema 權威：skills/foundry-platform/config-schema.md「`.foundry/org.yml`」一節
# 規則權威：skills/foundry-protocol/SKILL.md 第 9 節（組織圖與匯報線）＋第 8 節（模型分層）
# 建立於 2026-09-06。
#
# ⚠️ 本檔是**應然**，不是平台實況的鏡子。它宣告「這個專案該有哪些角色、誰向誰匯報、
#    各自掛什麼、用哪一層模型」；平台上這些 agent 建好了沒有是另一回事。
#    `--selfcheck` 的 `org-sync` 只比對本檔 ↔ protocol 第 9／8 節，**刻意不比對平台實況**。
#    角色可以先宣告在本檔、後才在平台上建出來（protocol `O1` 第 1 種情形；那段期間
#    該角色在第 9 節決策權矩陣裡的格子依 `O4` 由匯報對象暫代），是預期行為不是漏同步。
#    與平台的對帳歸承接建置的那張工單，不是 `org-sync` 的事。
#    本檔宣告的 9 名已於 2026-09-06（MYL-79）全數在平台上建置並逐格對帳，現為一致。
#
# ⚠️ agent 不得自行改本檔（同 `.foundry/config.yml`）。改動走 protocol 第 9 節
#    「結構調整先發卡提案、經使用者裁定」的同一條路徑；判準寫在 config-schema。
#
# ── `permissions[]` 的兩種來源（MYL-79 補，卡 `0bd69c99` Q4 核可）─────────────
# 讀這一欄的時候要分開看，兩種來源的證據強度不同：
#
# 1. **有裁定來源的授權**——CEO 與 PM 兩格逐條註明依據（見各該格的行內註解）。
# 2. **登記現況**——其餘 7 名。2026-09-06 以平台 API 逐一核對（`GET /api/agents/{id}`，
#    讀 `access.*` ＋ `access.grants[]`，**不讀面板的 `permissions.*`**——兩者會相反），
#    7 名全部 `canCreateSkills: true`、`access.grants` 全空、`taskAssignSource: none`。
#    寫進本檔不是變更，是把既有事實登記下來；體例同 protocol 第 8 節對 Frontend
#    Verifier 模型層的「登記現況」寫法。
#
# ⚠️ 一處**已知且刻意保留**的不一致（MYL-79 卡 `0bd69c99` Q5，使用者未選處理）：
#    Frontend Verifier 的 `access.canAssignTasks` 解為 `true`（來源 `simple_default`），
#    與本檔沒有宣告 `assign_tasks` 相反。它的 grant 已在 MYL-79 刪除，但那支 API 是
#    單向門——開過再關落在 `simple_default` 而不是回到 `none`，而能真正清掉那個鍵的
#    端點是 board-only。依 known-drift `L23` 這個旗標在 API 層並非強制閘門，
#    「FV 不派工」靠的是規則層自律，所以實務影響為零。**不要**把它讀成漏同步。

foundry_org: 1

# 這份組織宣告在哪個軸 A 平台上實現（欄位名由 MYL-82 正名定死）。
# 與 `.foundry/config.yml` 的同名欄位指同一件事，兩檔都寫時值必須一致（`org-sync` 比對）。
ai_platform: paperclip

roles:
  - id: ceo
    title: CEO
    reports_to: user
    model_tier: high
    # `O3`：CEO 是全隊唯一不掛第 1 層（foundry-protocol）的角色，代價由自己的 skill 承接。
    skills:
      - skills/roles/ceo/SKILL.md
    # `assign_tasks`：平台上來自 `ceo_role`（角色內建，不是逐條授予的 grant）。派工的拍板者
    #   依第 9 節矩陣是 PM，PM 已於 MYL-79 建置並持有自己的 `tasks:assign`，所以 CEO 這一格
    #   不再是 `O4` 的暫代、而是既有現況。要不要收回屬組織調整，走本檔頂部那條核可路徑。
    # `configure_agents`：登記現況（MYL-79 卡 `0bd69c99` Q5 核可補登記）。平台 grant
    #   `185a982d`，`grantedByUserId: null` ＝建 agent 時自帶、沒有人逐條授過。改 agent 的
    #   title／icon／模型層／權限旗標都靠它，一直在用；不登記的話本檔會持續落後平台。
    #   ⚠️ 這一格**寫不進去**——沒有面板欄位對應得到它，只讀得到（見 config-schema 值域表）。
    # `create_agents` 刻意不列：MYL-79 期間為建 PM 臨時開過一次，建完即請使用者收回。
    #   那是臨時授權，寫進本檔會把它變成常設宣告。
    permissions:
      - assign_tasks
      - configure_agents
      - create_skills

  - id: product-analyst
    title: Product Analyst
    reports_to: ceo
    model_tier: medium
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/product-analyst/SKILL.md
    permissions:
      - create_skills

  - id: pm
    title: PM
    reports_to: ceo
    model_tier: medium
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/pm/SKILL.md
    # 派工是本角色在第 9 節矩陣裡的拍板格，所以宣告 `assign_tasks`。平台上它是逐條授予的
    #   grant（`41fd8b90`，`taskAssignSource: explicit_grant`），與 CEO 那格的角色內建不同。
    # `model_tier: medium`：起草時填 `low`（第 8 節的建議值），使用者於 MYL-79 卡
    #   `0bd69c99` Q1 改判為中層，理由記在 protocol 第 8 節該條。已據以設定平台
    #   （`claude-opus-5`／`high`，2026-09-06 覆驗）。
    permissions:
      - assign_tasks
      - create_skills

  - id: scrum-master
    title: Scrum Master
    reports_to: ceo
    model_tier: low
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/scrum-master/SKILL.md
    # 排依賴鏈不需要指派權限（MYL-73 AC0 實測），所以這裡沒有 `assign_tasks`。
    permissions:
      - create_skills

  - id: frontend-verifier
    title: Frontend Verifier
    reports_to: ceo
    model_tier: medium
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/frontend-verifier/SKILL.md
    permissions:
      - create_skills

  - id: tech-lead
    title: Tech Lead
    reports_to: ceo
    model_tier: high
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/tech-lead/SKILL.md
    permissions:
      - create_skills

  - id: developer
    title: Developer
    reports_to: tech-lead
    model_tier: medium
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/developer/SKILL.md
    permissions:
      - create_skills

  - id: code-reviewer
    title: Code Reviewer
    reports_to: tech-lead
    model_tier: high
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/code-reviewer/SKILL.md
    permissions:
      - create_skills

  - id: qa-engineer
    title: QA Engineer
    reports_to: tech-lead
    model_tier: medium
    skills:
      - skills/foundry-protocol/SKILL.md
      - skills/roles/qa-engineer/SKILL.md
    permissions:
      - create_skills
