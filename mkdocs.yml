site_name: Foundry Handbook
site_description: Foundry — 跑在 Paperclip 上的 AI 開發團隊規範與手冊
site_url: ""

repo_name: AugustusHsu/agent-foundry
repo_url: https://github.com/AugustusHsu/agent-foundry

docs_dir: docs

theme:
  name: material
  language: zh-TW
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - 首頁: index.md
  - 使用手冊:
      - 手冊首頁: handbook/index.md
      - 1. 第一次使用走查: handbook/01-first-run.md
      - 2. 我該下什麼指令？: handbook/02-commands.md
      - 3. 流程會怎麼跑？: handbook/03-workflow.md
      - 4. 我要在哪幾個點做決定？: handbook/04-decision-points.md
      - 5. 故障排除: handbook/05-troubleshooting.md
      - 6. 團隊是怎麼編制的？: handbook/06-org-structure.md
      - 7. 團隊有哪些固定 workflow？: handbook/07-workflows.md

plugins:
  - search:
      lang: zh
