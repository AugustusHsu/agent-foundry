# Foundry 機械層閘門（CI）— MYL-36 P8
#
# 為什麼有這條 workflow：Foundry 的「關卡」在多數平台上靠 agent 自覺遵守，
# 但在 GitHub 上可以有**機械執行力**——PR 沒過就是沒過，不靠人記得。
# 這正是把自然語言規範轉成可機械驗證形式的那一步。
#
# 跑的內容與本機 `make check`、pre-commit hook 完全相同，
# 所以 CI 紅燈一定能在本機重現，不會出現「只有 CI 會壞」的情況。
#
# ⚠️ 這個保證有前提：**checkout 的 clone 形狀要跟本機一樣**。MYL-44 踩過一次——
# 自檢新增了吃 git 歷史的項目，而 checkout 還停在淺 clone，於是 CI 紅、本機綠。
# 動 `fetch-depth` 前先確認沒有自檢要讀歷史（現在有，見下方）。

name: foundry-lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `handbook-stamp`（MYL-44）要解出四章戳記指到的歷史 commit，並問
          # 「那顆之後動過 protocol 的 commit 有沒有手冊變更同行」——**需要完整歷史**。
          # 淺 clone 裡只有 tip 一顆 commit 物件，任何戳記 sha 都解不出來，
          # 四章會全部誤報「不是本 repo 的 commit」（MYL-44 D1 退回：main 連四紅）。
          # 原註解「不需要歷史」在 MYL-36 P8 當時成立，被 MYL-44 的新自檢推翻了。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # foundry-lint 只用標準函式庫，沒有依賴要裝——這是刻意的設計，
      # 讓閘門在任何環境都能跑起來，不會因為裝不了套件而被略過。
      # 三處（本機 make、pre-commit、CI）都走 Makefile 的同一個 target，
      # 新增工具時只改 Makefile 一處，不會出現「CI 沒跑到新測試」的無聲缺口。
      - name: 規範自檢（雙入口／手冊 nav／錨點／規則 ID）
        run: make selfcheck

      - name: 工具單元測試（foundry-lint ＋ model-routing）
        run: make test
