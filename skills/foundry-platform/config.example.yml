# .foundry/config.yml 範例（schema 見 skills/foundry-platform/config-schema.md）
# foundry-init 首次產生；gates 段之後由 foundry-gates 經使用者確認後改寫。

foundry: 2

devtools_platform: github   # 工具面：工單／狀態／看板放在哪
                            # github | gitlab | local-md | paperclip
                            # ⚠️ gitlab 的 adapter 已全覆蓋動詞，但沒有在真的 GitLab 專案上跑過，
                            #    且 foundry-init／foundry-adopt 的平台問卡尚未納入它——
                            #    填 gitlab 等於自己走一次首跑驗證（adapters/gitlab.md 附錄 B）。

# AI 平台面（選填，MYL-82）：agent 本身在哪裡執行與被喚醒。與上面的工具面正交。
# 整段註解掉＝未宣告。依它分派的動詞只有 provision_team（foundry-platform §8，
# 把 .foundry/org.yml 宣告的團隊在平台上建出來，只有 paperclip 跑得動）；
# 其餘軸 A 差異看 skills/foundry-ai-platform/ 的能力對照表。
# ai_platform: paperclip    # paperclip | claude-code | codex

# 對外可見面的鏡像平台（選填，MYL-39 T-2）。整段註解掉＝不鏡像。
# 語意：執行與喚醒仍在上面的 devtools_platform，工單「單向」鏡像到這裡供外部閱讀；
# 鏡像端唯讀——在那邊改狀態不會回寫，下次同步會被覆蓋。
# 值域同 devtools_platform，但必須是 adapter 寫了「鏡像模式」一節的平台（目前只有 github）。
# 鏡像端的 adapter 選項寫在下面 platform_options 的同名鍵，不另開結構。
# mirror_platform: github

platform_options:           # 選填；省略時用各 adapter 預設
  github:
    project_title: Foundry  # GitHub ProjectV2 標題
    project_owner: "@me"    # 個人帳號用 @me，org 專案填 org 名
  # gitlab:
  #   url: https://gitlab.example.com      # 自架實例必填；GitLab 不像 GitHub 只有一個站
  #   project_path: group/subgroup/project # 完整命名空間路徑（adapter 會整段 URL-encode）
  #   tier: free                           # free | premium — 填探測結果不是期望值，
  #                                        #   填錯不報錯，只會靜靜留下兩個 status:: label
  # local-md:
  #   id_prefix: FND        # 工單編號前綴，設定後不得變更
  # paperclip:
  #   company_id: "${PAPERCLIP_COMPANY_ID}"   # 省略時取同名環境變數
  #   project_id: "<專案 UUID>"

gates:
  spec_approval: user       # 關卡 A（做什麼）：user | ceo | tech-lead
  design_approval:          # 關卡 B（怎麼做）：可寫純值，或物件形式啟用小單跳過
    approver: user
    skip_below: small       # 掛 size:small 的工單跳過本關
  external_actions: user    # 關卡 C（要不要出去）：固定 user，不可調降

push:
  branch_push: tech-lead    # 分支 push＋開 PR：user | tech-lead
  main_push: user           # push main／force-push／tag：固定 user

# 模型供應商路由（選填，MYL-36）。整段註解掉＝未啟用＝全隊用執行環境預設供應商。
# 規則本體：foundry-protocol 第 8 節 M4~M6；流程：skills/foundry-model-routing/SKILL.md
# 先跑 `python3 tools/model-routing/probe_providers.py` 確認哪幾家真的可用再填。
# model_routing:
#   default_provider: claude
#   roles:                    # 角色 → 供應商；未列的角色用 default_provider
#     developer: codex        # 寫 code 與審 code 刻意分開兩家（M4），
#     code-reviewer: claude   # 目的是觀點互補，不是省額度
#   review_provider_distinct: true   # 強制 M4；設 false 需在工單記錄理由

# 文檔投影（選填，MYL-39 D-3；欄位由 MYL-52 落實）。整段註解掉＝不投影：
# 文件仍在版控內，只是沒有任何機械產生的閱讀面。這是預設狀態，不是設定缺漏。
# 三層：source（唯一可寫的真相）→ primary（主閱讀面）→ mirror_site（精裝站，可選）。
# 只有 source 可以人手改；投影面被人改過時，同步要停下報錯、不得覆蓋。
# ⚠️ 本段只宣告「已開通的管道」。開通目標面本身（啟用 wiki、新建公開 repo、開 Pages）
#    是關卡 C，不因為寫進這裡而獲得授權。
# docs:
#   source: docs/handbook/    # 來源目錄，相對 repo 根、以 / 結尾
#   primary: wiki             # 主閱讀面：wiki | repo（不投影、直接讀 repo）| none
#   link_policy: absolute     # 指向 repo 內部路徑的連結：absolute（改寫成絕對 URL）| plain（拆為純文字）
#   mirror_site:              # 整段省略＝不建精裝站
#     enabled: true           # 顯式 false＝保留設定但暫時關閉
#     trigger: tag            # tag | merge（合併進 main 即發）| manual
#     tag_pattern: 'handbook-v*'   # 只在 trigger: tag 時有意義
